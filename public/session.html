<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>logi-bot — セッション</title>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <!-- Mermaid v11 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
</head>
<body class="page-session">

  <!-- ── App Header ── -->
  <header class="app-header">
    <div class="header-inner">
      <a href="index.html" class="logo" title="ホームへ">🤖 <span>logi-bot</span></a>
      <div class="header-title" id="sessionTitle">読み込み中…</div>
      <div class="header-actions">
        <button class="mode-badge badge-demo" id="modeBadge" title="AI・モード設定を開く">🎭 DEMO</button>
        <button class="btn btn-ghost btn-sm btn-icon" id="settingsGearBtn" title="AI・モード設定">⚙️</button>
        <button class="btn btn-ghost btn-sm" id="copyMdBtn" title="現在の内容をMarkdownとしてコピー">📋 コピー</button>
        <button class="btn btn-ghost btn-sm" id="downloadMdBtn" title="Markdownファイルをダウンロード">⬇ .md</button>
      </div>
    </div>
  </header>

  <!-- ── Step Indicator ── -->
  <div class="step-indicator" id="stepIndicator" role="progressbar" aria-label="進行ステップ">
    <div class="step-item" data-step="onboarding">
      <div class="step-dot"></div>
      <div class="step-name">準備</div>
    </div>
    <div class="step-connector"></div>
    <div class="step-item" data-step="step1_core">
      <div class="step-dot">1</div>
      <div class="step-name">胸・腹</div>
    </div>
    <div class="step-connector"></div>
    <div class="step-item" data-step="step2_drilldown">
      <div class="step-dot">2</div>
      <div class="step-name">両腕</div>
    </div>
    <div class="step-connector"></div>
    <div class="step-item" data-step="step3_what_how">
      <div class="step-dot">3</div>
      <div class="step-name">両脚</div>
    </div>
    <div class="step-connector"></div>
    <div class="step-item" data-step="step4_verify">
      <div class="step-dot">4</div>
      <div class="step-name">点検</div>
    </div>
    <div class="step-connector"></div>
    <div class="step-item" data-step="step5_combine">
      <div class="step-dot">5</div>
      <div class="step-name">頭・台座</div>
    </div>
    <div class="step-connector"></div>
    <div class="step-item" data-step="complete">
      <div class="step-dot">🤖</div>
      <div class="step-name">完成</div>
    </div>
  </div>

  <!-- ── Session Body (2-pane) ── -->
  <div class="session-body" id="sessionBody">

    <!-- Left: Chat Pane -->
    <div class="chat-pane" id="chatPane">
      <div class="chat-messages" id="chatMessages" role="log" aria-live="polite" aria-label="会話履歴">
        <!-- メッセージが JS で挿入される -->
      </div>

      <div class="chat-input-area">
        <!-- ガード条件 未達通知 -->
        <div class="guard-notice" id="guardNotice" hidden role="alert">
          <div class="guard-notice-inner">
            <span class="guard-notice-icon">⚠️</span>
            <div class="guard-notice-body">
              <div class="guard-notice-title">次へ進む前に確認が必要な項目があります</div>
              <ul class="guard-missing-list" id="guardMissingList"></ul>
            </div>
            <button class="btn btn-ghost btn-sm" id="forceNextBtn" title="不完全なまま強制的に次へ進む">
              それでも進む
            </button>
          </div>
        </div>

        <!-- チャット入力フォーム -->
        <form class="chat-form" id="chatForm" autocomplete="off">
          <textarea
            class="chat-input" id="chatInput" rows="2"
            placeholder="メッセージを入力… (Enter で送信、Shift+Enter で改行)"
            maxlength="4000" aria-label="メッセージ入力"></textarea>
          <button class="chat-send" id="chatSendBtn" type="submit" aria-label="送信">↑</button>
        </form>
      </div>
    </div>

    <!-- Right: Diagram Pane -->
    <div class="diagram-pane" id="diagramPane">
      <div class="diagram-header">
        <div class="diagram-tabs" id="diagramTabs" role="tablist">
          <button class="diagram-tab active" data-tab="current" role="tab" aria-selected="true">
            現在のステップ
          </button>
          <button class="diagram-tab" data-tab="final" role="tab" aria-selected="false">
            合体ロボ全体図
          </button>
        </div>
        <div class="diagram-actions">
          <button class="btn btn-ghost btn-sm btn-icon" id="zoomDiagramBtn" title="拡大表示">⛶</button>
          <button class="btn btn-ghost btn-sm btn-icon" id="showCodeBtn" title="Mermaidコードを表示">{ }</button>
        </div>
      </div>
      <div class="diagram-content" id="diagramContent" aria-label="Mermaid図プレビュー">
        <div class="diagram-placeholder">
          <div class="placeholder-icon">📊</div>
          <div class="placeholder-text">ステップを進めると図が生成されます</div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── Bottom Navigation ── -->
  <nav class="session-nav" id="sessionNav" aria-label="ステップナビゲーション">
    <button class="btn btn-ghost btn-nav" id="backBtn" disabled aria-label="前のステップへ戻る">
      ← 前へ
    </button>
    <div class="nav-center">
      <span class="step-label" id="stepLabel">読み込み中…</span>
    </div>
    <button class="btn btn-primary btn-nav" id="nextBtn" aria-label="次のステップへ進む">
      次のステップへ →
    </button>
  </nav>

  <!-- ── Zoom Modal ── -->
  <div class="modal-overlay" id="zoomModal" hidden role="dialog" aria-modal="true" aria-labelledby="zoomModalTitle">
    <div class="modal">
      <div class="modal-header">
        <h3 class="modal-title" id="zoomModalTitle">図の拡大表示</h3>
        <button class="btn btn-ghost btn-sm btn-icon modal-close" id="zoomModalClose" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-tabs" id="modalTabs" role="tablist">
          <button class="modal-tab active" data-mode="svg" role="tab">SVG</button>
          <button class="modal-tab" data-mode="code" role="tab">コード</button>
        </div>
        <div class="modal-diagram" id="modalDiagram" role="img" aria-label="Mermaid図（拡大）"></div>
        <pre class="modal-code" id="modalCode" hidden aria-label="Mermaidソースコード"></pre>
      </div>
    </div>
  </div>

  <script type="module" src="js/session-app.js"></script>
  <script type="module">
    import { initSettings, renderBadge } from "./js/settings.js";
    document.addEventListener("DOMContentLoaded", () => {
      initSettings();
      document.getElementById("modeBadge").addEventListener("click", () => document.getElementById("settingsGearBtn").click());
    });
  </script>
</body>
</html>
